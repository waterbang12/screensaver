# XcodeGen spec. CI runs `xcodegen generate` to create Margin.xcodeproj, so the
# Xcode project never has to be edited (or committed) from Windows.
# Docs: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: Margin

options:
  bundleIdPrefix: dev.margin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Margin:
    type: application
    platform: iOS
    sources:
      - path: ios/App
      - path: ios/Shared
    info:
      path: ios/App/Info.plist
      properties:
        CFBundleDisplayName: Margin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MarginAppGroup: group.dev.margin.app
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: dev.margin.app
            CFBundleURLSchemes:
              - margin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.margin.app
        PRODUCT_NAME: Margin
        CODE_SIGN_ENTITLEMENTS: ios/App/Margin.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MarginWidget
        embed: true

  MarginWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Widget
      - path: ios/Shared
    info:
      path: ios/Widget/Info.plist
      properties:
        CFBundleDisplayName: Margin Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MarginAppGroup: group.dev.margin.app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.margin.app.widget
        PRODUCT_NAME: MarginWidget
        CODE_SIGN_ENTITLEMENTS: ios/Widget/MarginWidget.entitlements
        SKIP_INSTALL: YES

  MarginTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/Tests
      - path: ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.margin.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Margin:
    build:
      targets:
        Margin: all
        MarginWidget: all
        MarginTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarginTests
    archive:
      config: Release
